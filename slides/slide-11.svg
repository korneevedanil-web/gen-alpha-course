<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f6efe3"/><text x="100" y="160" font-family="Arial" font-size="86" font-weight="900" fill="#172326">Игра: переводчик с Альфа</text><rect x="120" y="300" width="1360" height="390" rx="48" fill="#fffaf2" stroke="#d9cdbd"/><text x="200" y="450" font-family="Arial" font-size="72" font-weight="900" fill="#e98a32">Bro has zero rizz.</text><text x="200" y="565" font-family="Arial" font-size="46" fill="#172326">Как бы вы сказали это по-русски?</text><text x="200" y="640" font-family="Arial" font-size="34" fill="#237f82">Сначала предложите свой вариант — потом откройте разбор.</text></svg>