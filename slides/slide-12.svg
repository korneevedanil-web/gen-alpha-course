<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f6efe3"/><text x="100" y="170" font-family="Arial" font-size="92" font-weight="900" fill="#172326">Главный вывод</text><text x="100" y="360" font-family="Arial" font-size="52" font-weight="700" fill="#237f82">Сленг — лаборатория языковых изменений.</text><g font-family="Arial" font-size="40" fill="#172326"><text x="130" y="500">01  Платформы ускоряют распространение</text><text x="130" y="590">02  Контекст важнее буквального перевода</text><text x="130" y="680">03  Слова создают идентичность и чувство группы</text></g><text x="100" y="800" font-family="Arial" font-size="36" fill="#e98a32">Чтобы понять слово, спросите: кто, где, зачем и с кем его использует?</text></svg>