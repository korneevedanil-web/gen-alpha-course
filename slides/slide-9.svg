<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f6efe3"/><text x="100" y="160" font-family="Arial" font-size="82" font-weight="900" fill="#172326">Почему 67 особенно интересно</text><text x="100" y="410" font-family="Arial" font-size="210" font-weight="900" fill="#e98a32">67</text><g font-family="Arial" font-size="40" fill="#172326"><text x="620" y="350">• трек Skrilla «Doot Doot (6 7)»</text><text x="620" y="440">• вирусный баскетбольный контекст</text><text x="620" y="530">• значение намеренно нестабильно</text><text x="620" y="620">• работает как групповой пароль</text></g><text x="100" y="780" font-family="Arial" font-size="38" font-weight="700" fill="#237f82">Фатическая функция: поддержать контакт и показать «я свой».</text></svg>