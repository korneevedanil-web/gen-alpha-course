<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f6efe3"/><text x="100" y="160" font-family="Arial" font-size="82" font-weight="900" fill="#172326">Зачем группе свой сленг?</text><g font-family="Arial"><rect x="100" y="300" width="650" height="190" rx="36" fill="#fffaf2" stroke="#d9cdbd"/><text x="150" y="380" font-size="42" font-weight="800" fill="#237f82">ИДЕНТИЧНОСТЬ</text><text x="150" y="445" font-size="34" fill="#172326">«Я свой»</text><rect x="850" y="300" width="650" height="190" rx="36" fill="#fffaf2" stroke="#d9cdbd"/><text x="900" y="380" font-size="42" font-weight="800" fill="#e98a32">СТАТУС</text><text x="900" y="445" font-size="34" fill="#172326">Знать актуальный контекст</text><rect x="100" y="550" width="650" height="190" rx="36" fill="#fffaf2" stroke="#d9cdbd"/><text x="150" y="630" font-size="42" font-weight="800" fill="#e98a32">ЭКОНОМИЯ</text><text x="150" y="695" font-size="34" fill="#172326">Ситуация одним словом</text><rect x="850" y="550" width="650" height="190" rx="36" fill="#fffaf2" stroke="#d9cdbd"/><text x="900" y="630" font-size="42" font-weight="800" fill="#237f82">ИРОНИЯ</text><text x="900" y="695" font-size="34" fill="#172326">Игра со смыслом</text></g></svg>