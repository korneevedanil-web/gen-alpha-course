<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f6efe3"/><text x="100" y="160" font-family="Arial" font-size="86" font-weight="900" fill="#172326">Brain rot</text><text x="100" y="350" font-family="Arial" font-size="110" font-weight="900" fill="#237f82">BRAIN ROT</text><text x="100" y="470" font-family="Arial" font-size="42" fill="#172326">Интернет говорит о последствиях самого интернета.</text><rect x="100" y="570" width="1400" height="170" rx="38" fill="#fffaf2" stroke="#d9cdbd"/><text x="150" y="650" font-family="Arial" font-size="36" fill="#596160">Oxford Word of the Year 2024</text><text x="150" y="705" font-family="Arial" font-size="32" fill="#172326">Низкоценный онлайн-контент и предполагаемый эффект его чрезмерного потребления.</text></svg>