<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f6efe3"/><text x="100" y="160" font-family="Arial" font-size="90" font-weight="900" fill="#172326">Как рождается сленг</text><g font-family="Arial" font-size="32" font-weight="700"><rect x="90" y="360" width="250" height="140" rx="70" fill="#fffaf2" stroke="#d9cdbd"/><text x="135" y="445" fill="#172326">автор / трек</text><text x="370" y="445" font-size="60" fill="#e98a32">→</text><rect x="450" y="360" width="250" height="140" rx="70" fill="#fffaf2" stroke="#d9cdbd"/><text x="490" y="445" fill="#172326">короткое видео</text><text x="730" y="445" font-size="60" fill="#e98a32">→</text><rect x="810" y="360" width="250" height="140" rx="70" fill="#fffaf2" stroke="#d9cdbd"/><text x="840" y="445" fill="#172326">повторение</text><text x="1090" y="445" font-size="60" fill="#e98a32">→</text><rect x="1170" y="360" width="330" height="140" rx="70" fill="#eef8f6" stroke="#b9d8d5"/><text x="1210" y="445" fill="#237f82">новый смысл</text></g><text x="100" y="680" font-family="Arial" font-size="42" fill="#172326">Алгоритмы платформ ускоряют распространение языковых новинок.</text></svg>